allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  defu: 6.1.5
  "@xmldom/xmldom": 0.8.13

  # Security pins for open Dependabot advisories. Scoped to the vulnerable
  # version ranges so non-vulnerable instances (e.g. brace-expansion@1.x,
  # which is not affected) keep their own resolution.
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "image-size@<2.0.3": 2.0.4
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
