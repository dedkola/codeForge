name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/validate-k8s.yml'
  pull_request:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - k8s
          - k8s/overlays/prod
          - k8s/overlays/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.4.3'

      - name: Validate Kustomize build
        run: kustomize build ${{ matrix.target }} > /dev/null
